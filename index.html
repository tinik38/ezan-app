<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f2a1d">
<title>Ezan Vakti - Frastanz</title>
<style>
  :root{
    --bg:#f4f4f4; --header:#0f2a1d; --accent:#164a30; --accent2:#3a5a40;
    --text:#222; --muted:#777; --card:#ffffff; --border:#e2e2e2;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;background:var(--bg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--text);}
  #app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);
    padding-bottom:90px;}
  header{background:var(--header);color:#fff;padding:16px 18px 14px;}
  header .date{font-size:14px;opacity:.95}
  header .hijri{font-size:13px;color:#c9e8d4;margin-top:2px}
  header .prophet{font-size:11px;color:#eaf5ec;margin-top:8px;line-height:1.5}
  .next-card{background:var(--accent);color:#fff;text-align:center;padding:18px 10px;}
  .next-card .label{font-size:12px;color:#a9d9bb;text-transform:uppercase;letter-spacing:.5px}
  .next-card .name{font-size:26px;font-weight:700;margin:4px 0}
  .next-card .countdown{font-size:20px;font-variant-numeric:tabular-nums}
  .times{position:relative;padding:10px 0;}
  .row{display:flex;justify-content:space-between;align-items:center;
    padding:10px 18px;font-size:16px;border-bottom:1px solid var(--border);}
  .row .name{color:#333}
  .row .time{font-weight:700}
  .row.active{background:#eef7f0}
  #panel-wrap{display:flex;justify-content:center;align-items:center;
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    pointer-events:none; z-index:2;}
  #panel-img{width:100px;height:118px;object-fit:cover;border-radius:6px;
    box-shadow:0 2px 10px rgba(0,0,0,.25); border:2px solid #fff;}
  section.card{background:var(--card);margin:10px 12px;border-radius:10px;
    padding:12px 14px;box-shadow:0 1px 3px rgba(0,0,0,.06);}
  .cat-title{font-size:13px;font-weight:700;color:#fff;padding:6px 10px;
    border-radius:6px;margin-bottom:6px;display:inline-block;}
  .cat-din .cat-title{background:#0f2a1d}
  .cat-tr .cat-title{background:#8a1c1c}
  .cat-at .cat-title{background:#1c3d8a}
  .cat-body{font-size:13px;color:#333;line-height:1.7;white-space:pre-line}
  .content-title{font-size:13px;font-weight:700;color:#fff;background:#3a5a40;
    padding:6px 10px;border-radius:6px;display:inline-block;margin-bottom:6px}
  .content-text{font-style:italic;font-size:14px;line-height:1.5;margin-bottom:4px}
  .content-source{font-size:11px;color:var(--muted)}
  .disclaimer{font-size:10px;color:#aaa;margin-top:6px;line-height:1.4}
  #status{font-size:11px;color:var(--muted);text-align:center;padding:6px 10px;}
  .btn-bar{position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:0 auto;
    background:#fff;border-top:1px solid var(--border);display:flex;
    padding:8px 12px calc(8px + env(safe-area-inset-bottom));gap:8px;}
  .btn{flex:1;padding:12px 8px;border:none;border-radius:8px;font-size:14px;
    font-weight:600;background:var(--accent);color:#fff;}
  .btn.secondary{background:#eee;color:#333}
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;
    align-items:flex-end;justify-content:center;z-index:50;}
  .modal-overlay.open{display:flex;}
  .modal{background:#fff;width:100%;max-width:480px;border-radius:16px 16px 0 0;
    padding:18px;max-height:86vh;overflow-y:auto;}
  .modal h2{margin:0 0 12px;font-size:17px;}
  .modal label{display:block;font-size:12px;color:#555;margin:10px 0 4px;}
  .modal input[type=text],.modal input[type=number]{width:100%;padding:8px;
    border:1px solid #ccc;border-radius:6px;font-size:14px;}
  .modal .row-inline{display:flex;gap:10px;}
  .modal .row-inline > div{flex:1;}
  .modal-close{display:block;width:100%;margin-top:16px;padding:12px;
    background:var(--accent);color:#fff;border:none;border-radius:8px;font-size:15px;}
  .lang-toggle{display:flex;gap:8px;margin-top:6px;}
  .lang-toggle button{flex:1;padding:8px;border-radius:6px;border:1px solid #ccc;
    background:#f7f7f7;font-size:13px;}
  .lang-toggle button.active{background:var(--accent);color:#fff;border-color:var(--accent);}
  #compass-wrap{display:flex;flex-direction:column;align-items:center;padding:10px 0;}
  #compass-canvas{width:260px;height:260px;}
  .qibla-info{text-align:center;font-size:15px;font-weight:700;margin:8px 0 2px;}
  .qibla-sub{text-align:center;font-size:12px;color:var(--muted);margin-bottom:10px;}
  .qibla-note{font-size:11px;color:#888;line-height:1.5;margin-top:10px;}
  .perm-btn{width:100%;padding:12px;background:var(--accent);color:#fff;border:none;
    border-radius:8px;font-size:14px;margin-bottom:10px;}
  .install-hint{font-size:11px;color:#999;text-align:center;margin-top:6px;}
  .section-title{font-size:13px;font-weight:700;color:#222;margin-top:18px !important;
    padding-top:12px;border-top:1px solid var(--border);}
  .checkbox-row{display:flex;align-items:center;gap:8px;font-size:13px;color:#333;margin:8px 0;}
  .checkbox-row input{width:18px;height:18px;}
  .file-status{font-size:12px;color:var(--muted);margin:4px 0;word-break:break-all;}
  .file-row{display:flex;gap:8px;margin-top:4px;}
  .file-btn{flex:1;text-align:center;padding:9px 6px;border-radius:6px;font-size:12px;
    background:var(--accent);color:#fff;border:none;cursor:pointer;}
  .file-btn.secondary{background:#eee;color:#333;}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="date" id="date-line">-</div>
    <div class="hijri" id="hijri-line">-</div>

  <div class="next-card">

    <div class="countdown" id="next-countdown">--:--:--</div>
  </div>

  <div class="times" id="times-list">
    <div id="panel-wrap"><img id="panel-img" src=""></div>
  </div>

  <div id="status">Yükleniyor...</div>

  <section class="card cat-din">
    <span class="cat-title" id="cat-din-title">🕌 Dini Önemli Günler</span>
    <div class="cat-body" id="cat-din-body">-</div>
  </section>
  <section class="card cat-tr">
    <span class="cat-title" id="cat-tr-title">🇹🇷 Türkiye İçin Önemli Günler</span>

  </section>
  <section class="card cat-at">

  </section>

  <section class="card">

    <div class="content-text" id="ayet-text">-</div>
    <div class="content-source" id="ayet-source"></div>
  </section>
  <section class="card">
    <span class="content-title" id="hadis-title">📜 Günün Hadisi</span>

    <div class="disclaimer" id="disclaimer-text"></div>
  </section>

  <div class="install-hint" id="install-hint"></div>
</div>

<div class="btn-bar">
  <button class="btn" id="qibla-open-btn">🧭 Kıble</button>
  <button class="btn secondary" id="settings-open-btn">⚙ Ayarlar</button>
</div>

<!-- Kıble modal -->
<div class="modal-overlay" id="qibla-overlay">
  <div class="modal">
    <h2 id="qibla-modal-title">Kıble Yönü</h2>
    <button class="perm-btn" id="compass-perm-btn">📱 Telefon Pusulasını Etkinleştir</button>
    <div id="compass-wrap">
      <canvas id="compass-canvas" width="260" height="260"></canvas>
    </div>
    <div class="qibla-info" id="qibla-bearing-info">-</div>
    <div class="qibla-sub" id="qibla-distance-info">-</div>
    <div class="qibla-note" id="qibla-note-text"></div>
    <button class="modal-close" onclick="closeModal('qibla-overlay')">Kapat</button>
  </div>
</div>

<!-- Ezan / Ezan Duası overlay -->
<div class="modal-overlay" id="ezan-overlay">
  <div class="modal">
    <h2 id="ezan-overlay-title">🕌 -</h2>
    <p id="ezan-overlay-msg" style="font-size:15px;"></p>
    <div id="ezan-overlay-dua-box" style="display:none;">
      <hr style="border:none;border-top:1px solid var(--border);margin:12px 0;">
      <div style="font-size:13px;font-weight:700;color:#3a5a40;" id="ezan-overlay-dua-title">Ezan Duası</div>
      <p dir="rtl" style="font-size:18px;line-height:1.8;margin:8px 0;" id="ezan-overlay-arabic"></p>
      <p style="font-size:14px;font-style:italic;" id="ezan-overlay-trans"></p>
      <div style="font-size:11px;color:var(--muted);" id="ezan-overlay-source"></div>
    </div>
    <button class="modal-close" onclick="closeModal('ezan-overlay')" id="ezan-overlay-close-btn">Sustur / Kapat</button>
  </div>
</div>

<!-- Ayarlar modal -->
<div class="modal-overlay" id="settings-overlay">
  <div class="modal">
    <h2 id="settings-modal-title">Ayarlar</h2>

    <label id="lang-label">Dil</label>
    <div class="lang-toggle">
      <button id="lang-tr-btn" onclick="setLang('tr')">Türkçe</button>
      <button id="lang-de-btn" onclick="setLang('de')">Deutsch</button>
    </div>

    <label id="ilce-label">Diyanet İlçe Kodu (varsayılan: Feldkirch)</label>
    <input type="number" id="ilce-input" value="11613">

    <label id="reminder-label">Vakitten kaç dakika önce hatırlatsın?</label>
    <input type="number" id="reminder-input" value="10" min="0" max="60">

    <div class="row-inline">
      <div>
        <label id="lat-label">Enlem</label>
        <input type="text" id="lat-input" value="47.2333">
      </div>
      <div>
        <label id="lon-label">Boylam</label>
        <input type="text" id="lon-input" value="9.6667">
      </div>
    </div>

    <button class="perm-btn" id="notif-perm-btn" style="margin-top:14px;">🔔 Bildirimleri Etkinleştir</button>
    <div class="qibla-note" id="notif-note"></div>

    <label id="ezan-dua-section-title" class="section-title">Ezan Duası</label>
    <label class="checkbox-row">
      <input type="checkbox" id="ezan-dua-checkbox" checked>
      <span id="ezan-dua-label">Ezandan sonra ezan duasını göster</span>
    </label>

    <label id="ezan-sound-section-title" class="section-title">Ezan Sesi</label>
    <div id="ezan-sound-status" class="file-status">-</div>
    <div class="file-row">
      <label class="file-btn" id="ezan-sound-choose-label">Dosya Seç<input type="file" id="ezan-sound-file" accept="audio/*" hidden></label>
      <button class="file-btn secondary" id="ezan-sound-clear-btn">Sesi Kaldır</button>
    </div>

    <label id="panel-section-title" class="section-title">Ortadaki Pano Resmi</label>
    <div class="file-row">
      <label class="file-btn" id="panel-choose-label">Resim Seç<input type="file" id="panel-file" accept="image/*" hidden></label>
      <button class="file-btn secondary" id="panel-reset-btn">Varsayılana Döndür</button>
    </div>

    <button class="modal-close" onclick="saveSettings()">Kaydet</button>
  </div>
</div>

/* ======================= State ======================= */
let STATE = {records: [], ilce: 11613, lastFetch: null, offline:false};

function T(key, ...args){
  const v = I18N[LANG][key];
  return typeof v === 'function' ? v(...args) : v;
}

/* ======================= Diyanet API ======================= */
const API_BASE = "https://ezanvakti.emushaf.net";
async function fetchTimes(ilceId){
  const res = await fetch(`${API_BASE}/vakitler/${ilceId}`);
  if(!res.ok) throw new Error("HTTP "+res.status);
  return await res.json();
}

async function loadTimes(force){
  const cfg = getConfig();
  document.getElementById('status').textContent = T('loading');
  try{
    const records = await fetchTimes(cfg.ilce);
    STATE.records = records;
    STATE.offline = false;
    localStorage.setItem('ezan_cache', JSON.stringify({ilce: cfg.ilce, records, ts: Date.now()}));
    document.getElementById('status').textContent = T('updated') + new Date().toLocaleTimeString();
  }catch(e){
    STATE.offline = true;
    const cache = JSON.parse(localStorage.getItem('ezan_cache') || 'null');
    if(cache && cache.ilce == cfg.ilce){
      STATE.records = cache.records;
      document.getElementById('status').textContent = T('offline');
    }else{
      document.getElementById('status').textContent = T('update_error');
    }
  }
  renderAll();
}

function pad2(n){ return String(n).padStart(2,'0'); }
function formatDateKey(date){
  // Diyanet formatı ile birebir aynı: DD.MM.YYYY (sıfırlı, iki haneli).
  // toLocaleDateString() bazı telefon/tarayıcılarda tek haneli gün/ay
  // üretebiliyor (ör. "28.8.2026"), bu da eşleşmeyi bozup vakitlerin
  // boş görünmesine sebep oluyordu - bu yüzden burada elle biçimlendiriyoruz.
  return `${pad2(date.getDate())}.${pad2(date.getMonth()+1)}.${date.getFullYear()}`;
}
function findRecordForDate(records, date){
  const target = formatDateKey(date);
  return records.find(r => (r.MiladiTarihKisa||'').trim() === target);
}

/* ======================= Render ======================= */
// Hangi vakitler için hatırlatma/ezan zaten tetiklendi - telefonun kalıcı
// hafızasına (localStorage) yazılır. Sadece hafızada (JS değişkeninde)
// tutmak yeterli değildi: bazı telefon tarayıcıları arka plandaki sekmeyi
// bir süre sonra kendiliğinden yeniliyor/sıfırlıyor, bu da programın
// "bu vakti zaten çaldım" bilgisini unutup AYNI VAKTİ TEKRAR ÇALMASINA
// sebep oluyordu. Artık bu bilgi telefonda kalıcı olarak saklanıyor.
function loadFiredState(){
  const today = new Date().toDateString();
  try{
    const raw = JSON.parse(localStorage.getItem('ezan_fired_state') || 'null');
    if(raw && raw.date === today){
      return {date: today, reminder: new Set(raw.reminder || []), ezan: new Set(raw.ezan || [])};
    }
  }catch(e){}
  return {date: today, reminder: new Set(), ezan: new Set()};
}
function saveFiredState(){
  localStorage.setItem('ezan_fired_state', JSON.stringify({
    date: firedState.date,
    reminder: Array.from(firedState.reminder),
    ezan: Array.from(firedState.ezan),
  }));
}
let firedState = loadFiredState();

function renderAll(){
  const t = I18N[LANG];
  document.getElementById('cat-din-title').textContent = t.cat_din;
  document.getElementById('cat-tr-title').textContent = t.cat_tr;
  document.getElementById('cat-at-title').textContent = t.cat_at;
  document.getElementById('ayet-title').textContent = t.ayet;
  document.getElementById('hadis-title').textContent = t.hadis;
  document.getElementById('disclaimer-text').textContent = t.disclaimer;
  document.getElementById('next-label').textContent = t.next_label;
  document.getElementById('install-hint').textContent = t.install_hint;

  const now = new Date();
  document.getElementById('date-line').textContent =
    formatDateKey(now) + ' - ' + t.weekdays[(now.getDay()+6)%7];

  // Gün değiştiyse hatırlatma/ezan geçmişini sıfırla (yeni gün, yeni vakitler)
  const todayKey = now.toDateString();
  if(todayKey !== firedState.date){
    firedState = {date: todayKey, reminder: new Set(), ezan: new Set()};
    saveFiredState();
  }

  const today = findRecordForDate(STATE.records, now);
  const tomorrow = findRecordForDate(STATE.records, new Date(now.getTime()+86400000));

  const timesList = document.getElementById('times-list');
  timesList.querySelectorAll('.row').forEach(r=>r.remove());
  let nextKey=null, nextDate=null;
  PRAYER_ORDER.forEach(key=>{
    const row = document.createElement('div');
    row.className='row';
    const val = today ? (today[key]||'--:--') : '--:--';
    row.innerHTML = `<span class="name">${t.prayers[key]}</span><span class="time">${val}</span>`;
    timesList.appendChild(row);
    if(today && val !== '--:--'){
      const [hh,mm] = val.split(':').map(Number);
      const dt = new Date(now); dt.setHours(hh,mm,0,0);
      if(dt > now && !nextDate){ nextKey=key; nextDate=dt; row.classList.add('active'); }
    }
  });
  if(!nextDate && tomorrow && tomorrow.Imsak){
    const [hh,mm] = tomorrow.Imsak.split(':').map(Number);
    const dt = new Date(now.getTime()+86400000); dt.setHours(hh,mm,0,0);
    nextKey='Imsak'; nextDate=dt;
  }
  document.getElementById('next-name').textContent = nextKey ? t.prayers[nextKey] : '-';
  window._nextDate = nextDate; window._nextKey = nextKey;

  if(today){
    const hicri = today.HicriTarihKisa || '';
    document.getElementById('hijri-line').textContent = t.hijri + ': ' + formatHijri(hicri, t);
    const hy = parseHicriYear(hicri);
    document.getElementById('prophet-line').innerHTML =
      t.prophet_birth + '<br>' + t.prophet_death + '<br>' +
      (hy ? t.prophet_years(hy - 11) : t.prophet_years('-'));
  }

  renderSpecialDays(now, today ? today : null);
  renderDailyContent(now);
}

function parseHicriYear(hicriKisa){
  const parts = (hicriKisa||'').trim().split('.');
  if(parts.length===3) return parseInt(parts[2],10);
  return null;
}
function formatHijri(hicriKisa, t){
  const parts = (hicriKisa||'').trim().split('.');
  if(parts.length!==3) return hicriKisa||'';
  const gun=parseInt(parts[0],10), ay=parseInt(parts[1],10), yil=parts[2];
  return `${gun} ${t.months[ay-1]||ay} ${yil}`;
}

function renderSpecialDays(now, todayRec){
  const t = I18N[LANG];
  // Dini (Hicri, kayıtlardan)
  let dinLines = [];
  for(const rec of STATE.records){
    const hicri = rec.HicriTarihKisa; if(!hicri) continue;
    const parts = hicri.trim().split('.'); if(parts.length!==3) continue;
    const gun=parseInt(parts[0],10), ay=parseInt(parts[1],10);
    const mdate = parseMiladi(rec.MiladiTarihKisa);
    if(!mdate || mdate < stripTime(now)) continue;
    const daysDiff = Math.round((mdate-stripTime(now))/86400000);
    if(daysDiff>45) break;
    const key = DIN_FIXED[`${ay}-${gun}`];
    if(key) dinLines.push({date:mdate, text: DIN_NAMES[LANG][key], days:daysDiff});
    if(ay===7 && mdate.getDay()===4 && !dinLines.some(d=>d._regaib)){
      dinLines.push({date:mdate, text: LANG==='tr'?'Regaib Kandili':'Raghaib-Nacht', days:daysDiff, _regaib:true});
    }
  }
  dinLines.sort((a,b)=>a.date-b.date);
  renderCategoryBody('cat-din-body', dinLines.slice(0,3), t);

  // TR / AT (sabit miladi)
  renderFixedCategory('cat-tr-body', TR_FIXED, now, t);
  renderFixedCategory('cat-at-body', AT_FIXED, now, t);
}
function stripTime(d){ const x=new Date(d); x.setHours(0,0,0,0); return x; }
function parseMiladi(s){
  if(!s) return null;
  const [d,m,y] = s.trim().split('.').map(Number);
  if(!d||!m||!y) return null;
  return new Date(y,m-1,d);
}
function renderCategoryBody(elId, items, t){
  const el = document.getElementById(elId);
  if(!items.length){ el.textContent = t.no_upcoming; return; }
  el.textContent = items.map(it=> it.days===0 ? `• ${it.text} (${t.today})` : `• ${it.text} - ${it.days} ${t.days_left}`).join('\n');
}
function renderFixedCategory(elId, fixedMap, now, t){
  const today0 = stripTime(now);
  let items = [];
  for(const key in fixedMap){
    const [m,d] = key.split('-').map(Number);
    let year = now.getFullYear();
    let occ = new Date(year, m-1, d);
    if(occ < today0) occ = new Date(year+1, m-1, d);
    const days = Math.round((occ-today0)/86400000);
    if(days<=60){
      const label = fixedMap[key].split('|');
      items.push({date:occ, text: LANG==='tr'?label[0]:label[1], days});
    }
  }
  items.sort((a,b)=>a.date-b.date);
  renderCategoryBody(elId, items.slice(0,3), t);
}

function renderDailyContent(now){
  const t = I18N[LANG];
  const dayOfYear = Math.floor((now - new Date(now.getFullYear(),0,0))/86400000);
  const ayet = AYETLER[dayOfYear % AYETLER.length];
  const hadis = HADISLER[dayOfYear % HADISLER.length];
  document.getElementById('ayet-text').textContent = '\u201c'+(LANG==='tr'?ayet.tr:ayet.de)+'\u201d';
  document.getElementById('ayet-source').textContent = t.source+': '+(LANG==='tr'?ayet.k_tr:ayet.k_de);
  document.getElementById('hadis-text').textContent = '\u201c'+(LANG==='tr'?hadis.tr:hadis.de)+'\u201d';
  document.getElementById('hadis-source').textContent = t.source+': '+(LANG==='tr'?hadis.k_tr:hadis.k_de);
}

/* ======================= Sayaç / uyarılar ======================= */
function tick(){
  const now = new Date();
  if(window._nextDate){
    const remaining = Math.max(0, window._nextDate - now);
    const hh = String(Math.floor(remaining/3600000)).padStart(2,'0');
    const mm = String(Math.floor((remaining%3600000)/60000)).padStart(2,'0');
    const ss = String(Math.floor((remaining%60000)/1000)).padStart(2,'0');
    document.getElementById('next-countdown').textContent = `${hh}:${mm}:${ss}`;

    const cfg = getConfig();
    const reminderPoint = new Date(window._nextDate.getTime() - cfg.reminderMin*60000);
    if(now >= reminderPoint && now < window._nextDate && !firedReminder.has(window._nextKey)){
      firedReminder.add(window._nextKey);
      notify(T('reminder_msg', I18N[LANG].prayers[window._nextKey], cfg.reminderMin));
    }
    if(now >= window._nextDate && !firedEzan.has(window._nextKey)){
      firedEzan.add(window._nextKey);
      const prayerLabel = I18N[LANG].prayers[window._nextKey];
      notify(T('ezan_msg', prayerLabel));
      playEzanSound();
      showEzanOverlay(prayerLabel);
      renderAll();
    }
  }
  setTimeout(tick, 1000);
}

function notify(msg){
  if(window.Notification && Notification.permission === 'granted'){
    try{ new Notification('Ezan Vakti', {body: msg}); }catch(e){}
  }
  if(navigator.vibrate) navigator.vibrate([200,100,200]);
}
function playBeep(){
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    const o = ctx.createOscillator(); const g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.frequency.value = 880; g.gain.value = 0.15;
    o.start(); setTimeout(()=>{o.stop(); ctx.close();}, 700);
  }catch(e){}
}
let activeEzanAudio = null;
function playEzanSound(){
  const soundData = localStorage.getItem('ezan_sound_data');
  if(soundData){
    try{
      if(activeEzanAudio){ activeEzanAudio.pause(); }
      activeEzanAudio = new Audio(soundData);
      activeEzanAudio.play().catch(()=>{ playBeep(); });
      return;
    }catch(e){}
  }
  playBeep();
}
function stopEzanSound(){
  if(activeEzanAudio){ try{ activeEzanAudio.pause(); activeEzanAudio.currentTime = 0; }catch(e){} }
}
let ezanOverlayAutoCloseTimer = null;
function showEzanOverlay(prayerLabel){
  const t = I18N[LANG];
  document.getElementById('ezan-overlay-title').textContent = '🕌 ' + prayerLabel;
  document.getElementById('ezan-overlay-msg').textContent = T('ezan_msg', prayerLabel);
  document.getElementById('ezan-overlay-close-btn').textContent = t.ezan_overlay_close;

  const duaEnabled = localStorage.getItem('ezan_dua_enabled') !== 'false';
  const duaBox = document.getElementById('ezan-overlay-dua-box');
  if(duaEnabled){
    duaBox.style.display = 'block';
    document.getElementById('ezan-overlay-dua-title').textContent = t.ezan_dua_title;
    document.getElementById('ezan-overlay-arabic').textContent = EZAN_DUASI.arabic;
    document.getElementById('ezan-overlay-trans').textContent = LANG==='tr' ? EZAN_DUASI.tr : EZAN_DUASI.de;
    document.getElementById('ezan-overlay-source').textContent = t.source + ': ' + (LANG==='tr'?EZAN_DUASI.k_tr:EZAN_DUASI.k_de);
  }else{
    duaBox.style.display = 'none';
  }
  openModal('ezan-overlay');

  // 30 saniye sonra otomatik kapanır (kullanıcı daha önce elle kapatırsa
  // bu zamanlayıcı zaten iptal edilir - aşağıdaki close-btn dinleyicisine bak).
  if(ezanOverlayAutoCloseTimer) clearTimeout(ezanOverlayAutoCloseTimer);
  ezanOverlayAutoCloseTimer = setTimeout(()=>{
    closeModal('ezan-overlay');
    stopEzanSound();
  }, 30000);
}
// "Sustur / Kapat" butonuna basınca sesi de durdur ve otomatik kapanma
// zamanlayıcısını iptal et (zaten kapandığı için tekrar tetiklenmesin).
document.getElementById('ezan-overlay-close-btn').addEventListener('click', ()=>{
  stopEzanSound();
  if(ezanOverlayAutoCloseTimer){ clearTimeout(ezanOverlayAutoCloseTimer); ezanOverlayAutoCloseTimer=null; }
});

/* ======================= Kıble Pusulası ======================= */
const KAABA_LAT=21.4225, KAABA_LON=39.8262;
function computeBearing(lat1,lon1,lat2,lon2){
  const toRad = d=>d*Math.PI/180, toDeg = r=>r*180/Math.PI;
  const phi1=toRad(lat1), phi2=toRad(lat2), dl=toRad(lon2-lon1);
  const x = Math.sin(dl)*Math.cos(phi2);
  const y = Math.cos(phi1)*Math.sin(phi2) - Math.sin(phi1)*Math.cos(phi2)*Math.cos(dl);
  return (toDeg(Math.atan2(x,y))+360)%360;
}
function distanceKm(lat1,lon1,lat2,lon2){
  const toRad = d=>d*Math.PI/180, R=6371;
  const dphi=toRad(lat2-lat1), dl=toRad(lon2-lon1);
  const a = Math.sin(dphi/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dl/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}
function compassLabel(bearing){
  const dirsTr=["Kuzey","Kuzeydoğu","Doğu","Güneydoğu","Güney","Güneybatı","Batı","Kuzeybatı"];
  const dirsDe=["Norden","Nordosten","Osten","Südosten","Süden","Südwesten","Westen","Nordwesten"];
  const dirs = LANG==='tr'?dirsTr:dirsDe;
  return dirs[Math.floor((bearing+22.5)/45)%8];
}
let qiblaBearing=0, deviceHeading=null, compassActive=false;

function drawCompass(){
  const canvas = document.getElementById('compass-canvas');
  const ctx = canvas.getContext('2d');
  const W=canvas.width, H=canvas.height, cx=W/2, cy=H/2, r=W*0.42;
  ctx.clearRect(0,0,W,H);
  ctx.save();
  const rotation = compassActive && deviceHeading!==null ? -deviceHeading : 0;
  ctx.translate(cx,cy); ctx.rotate(rotation*Math.PI/180); ctx.translate(-cx,-cy);

  ctx.beginPath(); ctx.arc(cx,cy,r,0,7); ctx.fillStyle="#faf9f8"; ctx.fill();
  ctx.lineWidth=2; ctx.strokeStyle="#3c3c3c"; ctx.stroke();
  ctx.font="bold 16px sans-serif"; ctx.fillStyle="#282828"; ctx.textAlign="center"; ctx.textBaseline="middle";
  const labels = LANG==='tr' ? {0:'K',90:'D',180:'G',270:'B'} : {0:'N',90:'O',180:'S',270:'W'};
  for(const deg in labels){
    const rad = deg*Math.PI/180;
    ctx.fillText(labels[deg], cx + r*0.86*Math.sin(rad), cy - r*0.86*Math.cos(rad));
  }
  ctx.strokeStyle="#787878"; ctx.lineWidth=1;
  for(let deg=0; deg<360; deg+=15){
    const rad = deg*Math.PI/180;
    const outer = r*0.98, inner = r*(deg%90!==0?0.90:0.82);
    ctx.beginPath();
    ctx.moveTo(cx+outer*Math.sin(rad), cy-outer*Math.cos(rad));
    ctx.lineTo(cx+inner*Math.sin(rad), cy-inner*Math.cos(rad));
    ctx.stroke();
  }
  const rad = qiblaBearing*Math.PI/180;
  const tipX = cx + r*0.80*Math.sin(rad), tipY = cy - r*0.80*Math.cos(rad);
  const b1 = ((qiblaBearing+150)*Math.PI/180), b2=((qiblaBearing-150)*Math.PI/180);
  ctx.beginPath();
  ctx.moveTo(tipX,tipY);
  ctx.lineTo(cx+r*0.16*Math.sin(b1), cy-r*0.16*Math.cos(b1));
  ctx.lineTo(cx+r*0.16*Math.sin(b2), cy-r*0.16*Math.cos(b2));
  ctx.closePath(); ctx.fillStyle="#c71e28"; ctx.fill();
  ctx.beginPath(); ctx.arc(cx,cy,W*0.02,0,7); ctx.fillStyle="#1e1e1e"; ctx.fill();
  ctx.restore();
}

function updateQiblaInfo(){
  const cfg = getConfig();
  qiblaBearing = computeBearing(cfg.lat, cfg.lon, KAABA_LAT, KAABA_LON);
  const km = Math.round(distanceKm(cfg.lat, cfg.lon, KAABA_LAT, KAABA_LON));
  document.getElementById('qibla-bearing-info').textContent = T('qibla_bearing', qiblaBearing.toFixed(1), compassLabel(qiblaBearing));
  document.getElementById('qibla-distance-info').textContent = T('qibla_distance', km);
  document.getElementById('qibla-note-text').textContent = compassActive ? T('qibla_note_on') : T('qibla_note_off');
  document.getElementById('qibla-modal-title').textContent = T('qibla_title');
  document.getElementById('compass-perm-btn').textContent = T('compass_perm');
  drawCompass();
}

function handleOrientation(e){
  let heading = null;
  if(e.webkitCompassHeading !== undefined){ heading = e.webkitCompassHeading; }
  else if(e.absolute && e.alpha !== null){ heading = 360 - e.alpha; }
  else if(e.alpha !== null){ heading = 360 - e.alpha; }
  if(heading !== null){
    deviceHeading = heading; compassActive = true;
    updateQiblaInfo();
  }
}

document.getElementById('compass-perm-btn').addEventListener('click', async ()=>{
  try{
    if(typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function'){
      const perm = await DeviceOrientationEvent.requestPermission();
      if(perm === 'granted'){
        window.addEventListener('deviceorientation', handleOrientation, true);
      }else{
        alert(T('compass_denied'));
      }
    }else if(window.DeviceOrientationEvent){
      window.addEventListener('deviceorientationabsolute', handleOrientation, true);
      window.addEventListener('deviceorientation', handleOrientation, true);
    }else{
      alert(T('compass_denied'));
    }
  }catch(e){ alert(T('compass_denied')); }
});

/* ======================= Ayarlar / Modal ======================= */
function getConfig(){
  return {
    ilce: parseInt(localStorage.getItem('ezan_ilce')||'11613',10),
    reminderMin: parseInt(localStorage.getItem('ezan_reminder')||'10',10),
    lat: parseFloat(localStorage.getItem('ezan_lat')||'47.2333'),
    lon: parseFloat(localStorage.getItem('ezan_lon')||'9.6667'),
  };
}
function openModal(id){ document.getElementById(id).classList.add('open'); }
function closeModal(id){ document.getElementById(id).classList.remove('open'); }

document.getElementById('qibla-open-btn').addEventListener('click', ()=>{
  updateQiblaInfo(); openModal('qibla-overlay');
});
document.getElementById('settings-open-btn').addEventListener('click', ()=>{
  const cfg = getConfig();
  document.getElementById('ilce-input').value = cfg.ilce;
  document.getElementById('reminder-input').value = cfg.reminderMin;
  document.getElementById('lat-input').value = cfg.lat;
  document.getElementById('lon-input').value = cfg.lon;
  document.getElementById('ezan-dua-checkbox').checked = localStorage.getItem('ezan_dua_enabled') !== 'false';
  refreshSettingsTexts();
  refreshFileStatuses();
  openModal('settings-overlay');
});
function refreshSettingsTexts(){
  const t = I18N[LANG];
  document.getElementById('settings-modal-title').textContent = t.settings_title;
  document.getElementById('lang-label').textContent = t.lang;
  document.getElementById('ilce-label').textContent = t.ilce;
  document.getElementById('reminder-label').textContent = t.reminder;
  document.getElementById('lat-label').textContent = t.lat;
  document.getElementById('lon-label').textContent = t.lon;
  document.getElementById('notif-perm-btn').textContent = t.notif_btn;
  document.getElementById('lang-tr-btn').classList.toggle('active', LANG==='tr');
  document.getElementById('lang-de-btn').classList.toggle('active', LANG==='de');
  document.getElementById('ezan-dua-section-title').textContent = t.ezan_dua_title;
  document.getElementById('ezan-dua-label').textContent = t.ezan_dua_setting;
  document.getElementById('ezan-sound-section-title').textContent = t.ezan_sound_title;
  document.getElementById('ezan-sound-choose-label').firstChild.textContent = t.ezan_sound_choose;
  document.getElementById('ezan-sound-clear-btn').textContent = t.ezan_sound_clear;
  document.getElementById('panel-section-title').textContent = t.panel_title;
  document.getElementById('panel-choose-label').firstChild.textContent = t.panel_choose;
  document.getElementById('panel-reset-btn').textContent = t.panel_reset;
  const notifNote = document.getElementById('notif-note');
  if(window.Notification){
    notifNote.textContent = Notification.permission === 'granted' ? t.notif_on : t.notif_off;
  }
  refreshFileStatuses();
}
function refreshFileStatuses(){
  const t = I18N[LANG];
  const soundData = localStorage.getItem('ezan_sound_data');
  const soundName = localStorage.getItem('ezan_sound_name');
  document.getElementById('ezan-sound-status').textContent =
    soundData ? (t.ezan_sound_current + (soundName||'')) : t.ezan_sound_none;
}
function setLang(l){
  LANG = l; localStorage.setItem('ezan_lang', l);
  refreshSettingsTexts(); renderAll();
}

/* -- Dosya yükleme: ezan sesi -- */
document.getElementById('ezan-sound-file').addEventListener('change', (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  if(file.size > 4*1024*1024){ alert(T('file_too_big')); e.target.value=''; return; }
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      localStorage.setItem('ezan_sound_data', reader.result);
      localStorage.setItem('ezan_sound_name', file.name);
      refreshFileStatuses();
    }catch(err){ alert(T('file_too_big')); }
  };
  reader.readAsDataURL(file);
});
document.getElementById('ezan-sound-clear-btn').addEventListener('click', ()=>{
  localStorage.removeItem('ezan_sound_data');
  localStorage.removeItem('ezan_sound_name');
  refreshFileStatuses();
});

/* -- Dosya yükleme: pano resmi -- */
document.getElementById('panel-file').addEventListener('change', (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  if(file.size > 4*1024*1024){ alert(T('file_too_big')); e.target.value=''; return; }
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      localStorage.setItem('ezan_panel_data', reader.result);
      applyPanelImage();
    }catch(err){ alert(T('file_too_big')); }
  };
  reader.readAsDataURL(file);
});
document.getElementById('panel-reset-btn').addEventListener('click', ()=>{
  localStorage.removeItem('ezan_panel_data');
  applyPanelImage();
});
function applyPanelImage(){
  const custom = localStorage.getItem('ezan_panel_data');
  if(custom){
    document.getElementById('panel-img').src = custom;
  }else{
    initPanel();
  }
}

function saveSettings(){
  const newIlce = parseInt(document.getElementById('ilce-input').value,10) || 11613;
  const oldIlce = getConfig().ilce;
  localStorage.setItem('ezan_ilce', newIlce);
  localStorage.setItem('ezan_reminder', document.getElementById('reminder-input').value || '10');
  localStorage.setItem('ezan_lat', document.getElementById('lat-input').value || '47.2333');
  localStorage.setItem('ezan_lon', document.getElementById('lon-input').value || '9.6667');
  localStorage.setItem('ezan_dua_enabled', document.getElementById('ezan-dua-checkbox').checked ? 'true' : 'false');
  closeModal('settings-overlay');
  if(newIlce !== oldIlce){ loadTimes(true); } else { renderAll(); }
}
document.getElementById('notif-perm-btn').addEventListener('click', async ()=>{
  if(window.Notification){
    await Notification.requestPermission();
    refreshSettingsTexts();
  }
});

/* ======================= Başlangıç ======================= */
applyPanelImage();
loadTimes();
tick();
refreshSettingsTexts();
setInterval(()=>loadTimes(false), 1000*60*60*6);
</script>
